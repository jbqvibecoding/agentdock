# 发版：推送 v* 标签（如 `npm version patch && git push --follow-tags`）即打包 macOS 通用版
# （Apple 芯片 + Intel）并发布到 GitHub Releases。手动运行（workflow_dispatch）只打包、
# 把安装包作为 Actions 产物上传，不建 Release。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有 Apple 开发者证书：ad-hoc 签名，Apple 芯片上能运行，首次打开需在系统里放行一次
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: --target universal-apple-darwin --bundles app,dmg
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: AgentDock ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          releaseBody: |
            ## 下载

            **`AgentDock_*_universal.dmg`**：Apple 芯片和 Intel Mac 通用，macOS 12 起可用（原生 Liquid Glass 需 macOS 26）。

            ## 首次打开

            这个版本没有经过 Apple 公证（ad-hoc 签名），macOS 第一次会拦下：

            1. 打开 dmg，把 AgentDock 拖进「应用程序」。
            2. 双击打开，提示无法验证时点「完成」，再到 **系统设置 › 隐私与安全性** 底部点「仍要打开」。
            3. 或者在终端执行一次：`xattr -dr com.apple.quarantine /Applications/AgentDock.app`

            呼叫 Grok Bot 等桌面 App 需要在 **系统设置 › 隐私与安全性 › 辅助功能** 里允许 AgentDock。升级到新版本后若又提示需要授权，把列表里的 AgentDock 关掉再打开一次。

            ---

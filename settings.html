<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>AgentDock 设置</title>
    <link rel="stylesheet" href="/src/settings.css" />
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body>
    <div class="win">
      <aside class="side" data-tauri-drag-region>
        <div class="side__spacer" data-tauri-drag-region></div>
        <nav class="nav" aria-label="设置分区">
          <button class="nav__item is-active" data-page="seats"><span class="nav__ic">◉</span>席位</button>
          <button class="nav__item" data-page="hotkeys"><span class="nav__ic">⌘</span>快捷键</button>
          <button class="nav__item" data-page="appearance"><span class="nav__ic">◐</span>外观</button>
          <button class="nav__item" data-page="mic"><span class="nav__ic">◎</span>麦克风</button>
          <button class="nav__item" data-page="about"><span class="nav__ic">ⓘ</span>关于</button>
        </nav>
        <div class="side__foot">AgentDock <span id="ver"></span></div>
      </aside>
      <main class="main">
        <header class="main__head" data-tauri-drag-region>
          <h1 id="title" data-tauri-drag-region>席位</h1>
          <p id="subtitle" data-tauri-drag-region></p>
        </header>
        <section id="page" class="page"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>

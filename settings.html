<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="window.title">AgentDock 设置</title>
    <link rel="stylesheet" href="/src/settings.css" />
    <script type="module" src="/src/settings.ts" defer></script>
  </head>
  <body>
    <div class="win">
      <aside class="side" data-tauri-drag-region>
        <div class="side__spacer" data-tauri-drag-region></div>
        <nav class="nav" aria-label="设置分区" data-i18n-aria="nav.aria">
          <button class="nav__item is-active" data-page="seats"><span class="nav__ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="6" cy="6" r="2.6"/><circle cx="14" cy="6" r="2.6"/><circle cx="6" cy="14" r="2.6"/><circle cx="14" cy="14" r="2.6"/></svg></span><span data-i18n="nav.seats">Agent</span></button>
          <button class="nav__item" data-page="hotkeys"><span class="nav__ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="16" height="10" rx="2.5"/><path d="M5 8.5h1M8 8.5h1M11 8.5h1M14 8.5h1M6.5 12h7"/></svg></span><span data-i18n="nav.hotkeys">快捷键</span></button>
          <button class="nav__item" data-page="appearance"><span class="nav__ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor" stroke="none"/></svg></span><span data-i18n="nav.appearance">外观</span></button>
          <button class="nav__item" data-page="mic"><span class="nav__ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg></span><span data-i18n="nav.mic">麦克风</span></button>
          <button class="nav__item" data-page="memory"><span class="nav__ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2a4.2 4.2 0 0 0-4.2 4.2c0 1.5.7 2.6 1.6 3.4.6.5 1 1.1 1.1 1.8h3c.1-.7.5-1.3 1.1-1.8.9-.8 1.6-1.9 1.6-3.4A4.2 4.2 0 0 0 10 3.2z"/><path d="M8.2 14.6h3.6M8.6 16.4h2.8"/></svg></span><span data-i18n="nav.memory">记忆</span></button>
          <button class="nav__item" data-page="about"><span class="nav__ic"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 9v4.5"/><circle cx="10" cy="6.4" r=".6" fill="currentColor"/></svg></span><span data-i18n="nav.about">关于</span></button>
        </nav>
        <div class="side__foot">AgentDock <span id="ver"></span></div>
      </aside>
      <main class="main">
        <header class="main__head" data-tauri-drag-region>
          <h1 id="title" data-tauri-drag-region>Agent</h1>
          <p id="subtitle" data-tauri-drag-region></p>
        </header>
        <section id="page" class="page"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
